{% extends 'layouts/base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>餐饮推荐查询</h5>
            </div>
            <div class="ibox-content">
                <form id="recommendationForm" class="form-horizontal">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">年龄段</label>
                        <div class="col-sm-4">
                            <select class="form-control" name="age_group" required>
                                <option value="">请选择年龄段</option>
                                <option value="PRIMARY">小学</option>
                                <option value="JUNIOR">初中</option>
                                <option value="SENIOR">高中</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label">学校</label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" name="school" placeholder="请输入学校名称" required>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">饮食偏好</label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="preference" rows="3" placeholder="请输入饮食偏好，例如：喜欢清淡、不吃辣、素食主义等"></textarea>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm-12 text-center">
                            <button type="submit" class="btn btn-primary btn-lg">获取推荐</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="row" id="resultContainer" style="display: none;">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>推荐结果</h5>
            </div>
            <div class="ibox-content">
                <div id="loadingResult" class="text-center" style="padding: 50px 0;">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <p class="mt-3">正在生成推荐结果，请稍候...</p>
                </div>
                <div id="resultContent" style="display: none;">
                    <div class="row">
                        <div class="col-lg-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">早餐推荐</h5>
                                    <div id="breakfastResult" class="mt-3"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">午餐推荐</h5>
                                    <div id="lunchResult" class="mt-3"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">晚餐推荐</h5>
                                    <div id="dinnerResult" class="mt-3"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    $(document).ready(function() {
        $('#recommendationForm').submit(function(e) {
            e.preventDefault();
            
            if (!validateForm('#recommendationForm')) {
                return;
            }
            
            var formData = $(this).serialize();
            
            // 显示结果容器和加载状态
            $('#resultContainer').show();
            $('#loadingResult').show();
            $('#resultContent').hide();
            
            // 滚动到结果区域
            $('html, body').animate({
                scrollTop: $('#resultContainer').offset().top - 100
            }, 500);
            
            // 发送AJAX请求获取推荐结果
            $.ajax({
                url: '/recommendation/generate',
                type: 'POST',
                data: formData,
                dataType: 'json',
                success: function(response) {
                    $('#loadingResult').hide();
                    $('#resultContent').show();
                    
                    // 渲染推荐结果
                    renderRecommendation(response);
                },
                error: function(xhr, status, error) {
                    $('#loadingResult').hide();
                    
                    var errorMessage = '获取推荐结果失败，请稍后重试';
                    if (xhr.responseJSON && xhr.responseJSON.detail) {
                        errorMessage = xhr.responseJSON.detail;
                    }
                    
                    showMessage(errorMessage, 'danger');
                }
            });
        });
        
        // 渲染推荐结果
        function renderRecommendation(data) {
            if (data.recommendation) {
                var recommendation = JSON.parse(data.recommendation);
                
                // 渲染早餐推荐
                if (recommendation.breakfast) {
                    $('#breakfastResult').html(renderDishList(recommendation.breakfast));
                }
                
                // 渲染午餐推荐
                if (recommendation.lunch) {
                    $('#lunchResult').html(renderDishList(recommendation.lunch));
                }
                
                // 渲染晚餐推荐
                if (recommendation.dinner) {
                    $('#dinnerResult').html(renderDishList(recommendation.dinner));
                }
            }
        }
        
        // 渲染菜品列表
        function renderDishList(dishes) {
            var html = '<ul class="list-group">';
            
            dishes.forEach(function(dish) {
                html += '<li class="list-group-item">';
                html += '<h6>' + dish.name + '</h6>';
                if (dish.description) {
                    html += '<p class="text-muted mb-1">' + dish.description + '</p>';
                }
                if (dish.ingredients) {
                    html += '<small class="text-primary">配料：' + dish.ingredients + '</small><br>';
                }
                if (dish.nutrition) {
                    html += '<small class="text-success">营养：' + dish.nutrition + '</small>';
                }
                html += '</li>';
            });
            
            html += '</ul>';
            return html;
        }
    });
</script>
{% endblock %}
