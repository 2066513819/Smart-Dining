{% extends 'layouts/base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>角色管理</h5>
                <div class="ibox-tools">
                    <a href="#" class="btn btn-primary btn-xs" id="addRoleBtn">
                        <i class="fa fa-plus"></i> 添加角色
                    </a>
                    <a href="#" class="btn btn-default btn-xs" id="refreshBtn">
                        <i class="fa fa-refresh"></i> 刷新
                    </a>
                </div>
            </div>
            <div class="ibox-content">
                <div class="row mb-3">
                    <div class="col-sm-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="请输入角色名称">
                            <div class="input-group-append">
                                <button class="btn btn-primary" type="button" id="searchBtn">搜索</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                            <tr>
                                <th style="width: 50px;">序号</th>
                                <th>角色名称</th>
                                <th>角色描述</th>
                                <th>权限标识</th>
                                <th>创建时间</th>
                                <th style="width: 150px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="roleTableBody">
                            <!-- 角色数据将通过AJAX动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="row">
                    <div class="col-sm-6">
                        <div class="dataTables_info" id="roleTableInfo" role="status" aria-live="polite">显示 0 到 0 条，共 0 条记录</div>
                    </div>
                    <div class="col-sm-6">
                        <div class="dataTables_paginate paging_simple_numbers" id="roleTablePagination">
                            <ul class="pagination"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 角色添加/编辑模态框 -->
<div class="modal fade" id="roleModal" tabindex="-1" role="dialog" aria-labelledby="roleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="roleModalLabel">添加角色</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="roleForm">
                <div class="modal-body">
                    <input type="hidden" id="roleId" name="id">
                    <div class="form-group">
                        <label for="roleName">角色名称</label>
                        <input type="text" class="form-control" id="roleName" name="name" placeholder="请输入角色名称" required>
                    </div>
                    <div class="form-group">
                        <label for="roleDescription">角色描述</label>
                        <textarea class="form-control" id="roleDescription" name="description" rows="3" placeholder="请输入角色描述"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="rolePermissions">权限标识</label>
                        <input type="text" class="form-control" id="rolePermissions" name="permissions" placeholder="请输入权限标识，多个权限用逗号分隔">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 权限分配模态框 -->
<div class="modal fade" id="permissionModal" tabindex="-1" role="dialog" aria-labelledby="permissionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="permissionModalLabel">分配权限</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="permissionRoleId">
                <div id="permissionTree">
                    <!-- 权限树将通过AJAX动态加载 -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="savePermissionBtn">保存权限</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    $(document).ready(function() {
        // 页面加载时加载角色数据
        loadRoles();
        
        // 搜索按钮点击事件
        $('#searchBtn').click(function() {
            loadRoles();
        });
        
        // 回车键搜索
        $('#searchInput').keypress(function(e) {
            if (e.which == 13) {
                loadRoles();
            }
        });
        
        // 刷新按钮点击事件
        $('#refreshBtn').click(function() {
            $('#searchInput').val('');
            loadRoles();
        });
        
        // 添加角色按钮点击事件
        $('#addRoleBtn').click(function() {
            // 重置表单
            $('#roleForm')[0].reset();
            $('#roleId').val('');
            $('#roleModalLabel').text('添加角色');
            $('#roleModal').modal('show');
        });
        
        // 角色表单提交事件
        $('#roleForm').submit(function(e) {
            e.preventDefault();
            
            if (!validateForm('#roleForm')) {
                return;
            }
            
            var formData = $(this).serialize();
            var url = '/system/roles';
            var method = 'POST';
            
            // 如果是编辑模式，使用PUT方法和带ID的URL
            var roleId = $('#roleId').val();
            if (roleId) {
                url += '/' + roleId;
                method = 'PUT';
            }
            
            // 发送AJAX请求保存角色
            $.ajax({
                url: url,
                type: method,
                data: formData,
                dataType: 'json',
                success: function(response) {
                    $('#roleModal').modal('hide');
                    showMessage('操作成功');
                    loadRoles();
                },
                error: function(xhr, status, error) {
                    var errorMessage = '操作失败，请稍后重试';
                    if (xhr.responseJSON && xhr.responseJSON.detail) {
                        errorMessage = xhr.responseJSON.detail;
                    }
                    showMessage(errorMessage, 'danger');
                }
            });
        });
        
        // 保存权限按钮点击事件
        $('#savePermissionBtn').click(function() {
            var roleId = $('#permissionRoleId').val();
            var permissions = [];
            
            // 获取选中的权限
            $('#permissionTree input:checked').each(function() {
                permissions.push($(this).val());
            });
            
            // 发送AJAX请求保存权限
            $.ajax({
                url: '/system/roles/' + roleId + '/permissions',
                type: 'POST',
                data: { permissions: permissions.join(',') },
                dataType: 'json',
                success: function(response) {
                    $('#permissionModal').modal('hide');
                    showMessage('权限分配成功');
                },
                error: function(xhr, status, error) {
                    var errorMessage = '权限分配失败，请稍后重试';
                    if (xhr.responseJSON && xhr.responseJSON.detail) {
                        errorMessage = xhr.responseJSON.detail;
                    }
                    showMessage(errorMessage, 'danger');
                }
            });
        });
        
        // 加载角色数据
        function loadRoles(page = 1, pageSize = 10) {
            var searchKeyword = $('#searchInput').val();
            
            showLoading('正在加载角色数据...');
            
            $.ajax({
                url: '/system/roles',
                type: 'GET',
                data: {
                    page: page,
                    page_size: pageSize,
                    keyword: searchKeyword
                },
                dataType: 'json',
                success: function(response) {
                    hideLoading();
                    renderRoleTable(response);
                },
                error: function(xhr, status, error) {
                    hideLoading();
                    showMessage('加载角色数据失败，请稍后重试', 'danger');
                }
            });
        }
        
        // 渲染角色表格
        function renderRoleTable(data) {
            var tbody = $('#roleTableBody');
            tbody.empty();
            
            if (data.items && data.items.length > 0) {
                data.items.forEach(function(role, index) {
                    var row = $('<tr></tr>');
                    row.append($('<td></td>').text((data.page - 1) * data.page_size + index + 1));
                    row.append($('<td></td>').text(role.name));
                    row.append($('<td></td>').text(role.description || '-'));
                    row.append($('<td></td>').text(role.permissions || '-'));
                    row.append($('<td></td>').text(formatDate(new Date(role.created_at), 'yyyy-MM-dd HH:mm:ss')));
                    
                    // 操作列
                    var actionHtml = '<div class="btn-group">';
                    actionHtml += '<a href="#" class="btn btn-primary btn-xs edit-role" data-id="' + role.id + '">编辑</a>';
                    actionHtml += '<a href="#" class="btn btn-warning btn-xs assign-permission" data-id="' + role.id + '" data-name="' + role.name + '">分配权限</a>';
                    actionHtml += '<a href="#" class="btn btn-danger btn-xs delete-role" data-id="' + role.id + '">删除</a>';
                    actionHtml += '</div>';
                    
                    row.append($('<td></td>').html(actionHtml));
                    tbody.append(row);
                });
                
                // 绑定编辑、分配权限和删除事件
                bindRoleActions();
            } else {
                var emptyRow = $('<tr><td colspan="6" class="text-center">暂无数据</td></tr>');
                tbody.append(emptyRow);
            }
            
            // 更新分页信息
            updatePagination(data);
        }
        
        // 绑定角色操作事件
        function bindRoleActions() {
            // 编辑角色
            $('.edit-role').click(function() {
                var roleId = $(this).data('id');
                
                // 获取角色详情
                $.ajax({
                    url: '/system/roles/' + roleId,
                    type: 'GET',
                    dataType: 'json',
                    success: function(role) {
                        // 填充表单
                        $('#roleId').val(role.id);
                        $('#roleName').val(role.name);
                        $('#roleDescription').val(role.description || '');
                        $('#rolePermissions').val(role.permissions || '');
                        
                        $('#roleModalLabel').text('编辑角色');
                        $('#roleModal').modal('show');
                    },
                    error: function(xhr, status, error) {
                        showMessage('获取角色详情失败，请稍后重试', 'danger');
                    }
                });
            });
            
            // 分配权限
            $('.assign-permission').click(function() {
                var roleId = $(this).data('id');
                var roleName = $(this).data('name');
                
                $('#permissionRoleId').val(roleId);
                $('#permissionModalLabel').text('分配权限 - ' + roleName);
                
                // 加载权限树
                loadPermissionTree(roleId);
                
                $('#permissionModal').modal('show');
            });
            
            // 删除角色
            $('.delete-role').click(function() {
                var roleId = $(this).data('id');
                
                if (confirm('确定要删除该角色吗？')) {
                    $.ajax({
                        url: '/system/roles/' + roleId,
                        type: 'DELETE',
                        dataType: 'json',
                        success: function(response) {
                            showMessage('删除成功');
                            loadRoles();
                        },
                        error: function(xhr, status, error) {
                            var errorMessage = '删除失败，请稍后重试';
                            if (xhr.responseJSON && xhr.responseJSON.detail) {
                                errorMessage = xhr.responseJSON.detail;
                            }
                            showMessage(errorMessage, 'danger');
                        }
                    });
                }
            });
        }
        
        // 加载权限树
        function loadPermissionTree(roleId) {
            showLoading('正在加载权限树...');
            
            $.ajax({
                url: '/system/permissions/tree',
                type: 'GET',
                data: { role_id: roleId },
                dataType: 'json',
                success: function(response) {
                    hideLoading();
                    renderPermissionTree(response.permissions, roleId);
                },
                error: function(xhr, status, error) {
                    hideLoading();
                    showMessage('加载权限树失败，请稍后重试', 'danger');
                }
            });
        }
        
        // 渲染权限树
        function renderPermissionTree(permissions, roleId) {
            var treeHtml = '<ul class="list-group">';
            
            permissions.forEach(function(permission) {
                treeHtml += renderPermissionNode(permission, roleId);
            });
            
            treeHtml += '</ul>';
            $('#permissionTree').html(treeHtml);
        }
        
        // 渲染权限节点
        function renderPermissionNode(permission, roleId) {
            var nodeHtml = '<li class="list-group-item">';
            nodeHtml += '<div class="custom-control custom-checkbox">';
            nodeHtml += '<input type="checkbox" class="custom-control-input" id="permission_' + permission.id + '" value="' + permission.id + '" ' + (permission.checked ? 'checked' : '') + '>';
            nodeHtml += '<label class="custom-control-label" for="permission_' + permission.id + '">' + permission.name + '</label>';
            nodeHtml += '</div>';
            
            // 如果有子权限，递归渲染
            if (permission.children && permission.children.length > 0) {
                nodeHtml += '<ul class="list-group ml-4 mt-2">';
                permission.children.forEach(function(childPermission) {
                    nodeHtml += renderPermissionNode(childPermission, roleId);
                });
                nodeHtml += '</ul>';
            }
            
            nodeHtml += '</li>';
            return nodeHtml;
        }
        
        // 更新分页
        function updatePagination(data) {
            var totalItems = data.total;
            var pageSize = data.page_size;
            var currentPage = data.page;
            var totalPages = Math.ceil(totalItems / pageSize);
            
            // 更新分页信息
            $('#roleTableInfo').text('显示 ' + ((currentPage - 1) * pageSize + 1) + ' 到 ' + Math.min(currentPage * pageSize, totalItems) + ' 条，共 ' + totalItems + ' 条记录');
            
            // 生成分页按钮
            var paginationHtml = '';
            
            // 上一页按钮
            var prevClass = currentPage === 1 ? 'disabled' : '';
            paginationHtml += '<li class="page-item ' + prevClass + '"><a class="page-link" href="#" data-page="' + (currentPage - 1) + '">上一页</a></li>';
            
            // 页码按钮
            for (var i = 1; i <= totalPages; i++) {
                var activeClass = currentPage === i ? 'active' : '';
                paginationHtml += '<li class="page-item ' + activeClass + '"><a class="page-link" href="#" data-page="' + i + '">' + i + '</a></li>';
            }
            
            // 下一页按钮
            var nextClass = currentPage === totalPages ? 'disabled' : '';
            paginationHtml += '<li class="page-item ' + nextClass + '"><a class="page-link" href="#" data-page="' + (currentPage + 1) + '">下一页</a></li>';
            
            // 更新分页容器
            $('#roleTablePagination ul').html(paginationHtml);
            
            // 绑定分页点击事件
            $('#roleTablePagination .page-link').click(function() {
                var page = $(this).data('page');
                if (page > 0 && page <= totalPages) {
                    loadRoles(page);
                }
            });
        }
    });
</script>
{% endblock %}
