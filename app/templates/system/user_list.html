{% extends 'layouts/base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>用户管理</h5>
                <div class="ibox-tools">
                    <a href="#" class="btn btn-primary btn-xs" id="addUserBtn">
                        <i class="fa fa-plus"></i> 添加用户
                    </a>
                    <a href="#" class="btn btn-default btn-xs" id="refreshBtn">
                        <i class="fa fa-refresh"></i> 刷新
                    </a>
                </div>
            </div>
            <div class="ibox-content">
                <div class="row mb-3">
                    <div class="col-sm-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="请输入用户名或学校">
                            <div class="input-group-append">
                                <button class="btn btn-primary" type="button" id="searchBtn">搜索</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                            <tr>
                                <th style="width: 50px;">序号</th>
                                <th>用户名</th>
                                <th>用户ID</th>
                                <th>学校</th>
                                <th>年龄段</th>
                                <th>角色</th>
                                <th style="width: 150px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- 用户数据将通过AJAX动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="row">
                    <div class="col-sm-6">
                        <div class="dataTables_info" id="userTableInfo" role="status" aria-live="polite">显示 0 到 0 条，共 0 条记录</div>
                    </div>
                    <div class="col-sm-6">
                        <div class="dataTables_paginate paging_simple_numbers" id="userTablePagination">
                            <ul class="pagination"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 用户添加/编辑模态框 -->
<div class="modal fade" id="userModal" tabindex="-1" role="dialog" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalLabel">添加用户</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="userForm">
                <div class="modal-body">
                    <input type="hidden" id="userId" name="id">
                    <div class="form-group">
                        <label for="userUsername">用户名</label>
                        <input type="text" class="form-control" id="userUsername" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="userPassword">密码</label>
                        <input type="password" class="form-control" id="userPassword" name="password" placeholder="请输入密码，编辑时留空则不修改">
                    </div>
                    <div class="form-group">
                        <label for="userUserId">用户ID</label>
                        <input type="text" class="form-control" id="userUserId" name="user_id" placeholder="请输入用户ID" required>
                    </div>
                    <div class="form-group">
                        <label for="userSchool">学校</label>
                        <input type="text" class="form-control" id="userSchool" name="school" placeholder="请输入学校名称" required>
                    </div>
                    <div class="form-group">
                        <label for="userAgeGroup">年龄段</label>
                        <select class="form-control" id="userAgeGroup" name="age_group" required>
                            <option value="">请选择年龄段</option>
                            <option value="PRIMARY">小学</option>
                            <option value="JUNIOR">初中</option>
                            <option value="SENIOR">高中</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="userRole">角色</label>
                        <select class="form-control" id="userRole" name="role" required>
                            <option value="">请选择角色</option>
                            <option value="ADMIN">管理员</option>
                            <option value="USER">普通用户</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    $(document).ready(function() {
        // 页面加载时加载用户数据
        loadUsers();
        
        // 搜索按钮点击事件
        $('#searchBtn').click(function() {
            loadUsers();
        });
        
        // 回车键搜索
        $('#searchInput').keypress(function(e) {
            if (e.which == 13) {
                loadUsers();
            }
        });
        
        // 刷新按钮点击事件
        $('#refreshBtn').click(function() {
            $('#searchInput').val('');
            loadUsers();
        });
        
        // 添加用户按钮点击事件
        $('#addUserBtn').click(function() {
            // 重置表单
            $('#userForm')[0].reset();
            $('#userId').val('');
            $('#userModalLabel').text('添加用户');
            $('#userModal').modal('show');
        });
        
        // 用户表单提交事件
        $('#userForm').submit(function(e) {
            e.preventDefault();
            
            if (!validateForm('#userForm')) {
                return;
            }
            
            var formData = $(this).serialize();
            var url = '/auth/register';
            var method = 'POST';
            
            // 如果是编辑模式，使用PUT方法和不同的URL
            var userId = $('#userId').val();
            if (userId) {
                url = '/auth/profile';
                method = 'PUT';
            }
            
            // 发送AJAX请求保存用户
            $.ajax({
                url: url,
                type: method,
                data: formData,
                dataType: 'json',
                success: function(response) {
                    $('#userModal').modal('hide');
                    showMessage('操作成功');
                    loadUsers();
                },
                error: function(xhr, status, error) {
                    var errorMessage = '操作失败，请稍后重试';
                    if (xhr.responseJSON && xhr.responseJSON.detail) {
                        errorMessage = xhr.responseJSON.detail;
                    }
                    showMessage(errorMessage, 'danger');
                }
            });
        });
        
        // 加载用户数据
        function loadUsers(page = 1, pageSize = 10) {
            var searchKeyword = $('#searchInput').val();
            
            showLoading('正在加载用户数据...');
            
            $.ajax({
                url: '/auth/users',
                type: 'GET',
                data: {
                    page: page,
                    page_size: pageSize,
                    keyword: searchKeyword
                },
                dataType: 'json',
                success: function(response) {
                    hideLoading();
                    renderUserTable(response);
                },
                error: function(xhr, status, error) {
                    hideLoading();
                    showMessage('加载用户数据失败，请稍后重试', 'danger');
                }
            });
        }
        
        // 渲染用户表格
        function renderUserTable(data) {
            var tbody = $('#userTableBody');
            tbody.empty();
            
            if (data.items && data.items.length > 0) {
                data.items.forEach(function(user, index) {
                    var row = $('<tr></tr>');
                    row.append($('<td></td>').text((data.page - 1) * data.page_size + index + 1));
                    row.append($('<td></td>').text(user.username));
                    row.append($('<td></td>').text(user.user_id));
                    row.append($('<td></td>').text(user.school));
                    row.append($('<td></td>').text(getAgeGroupText(user.age_group)));
                    row.append($('<td></td>').text(getRoleText(user.role)));
                    
                    // 操作列
                    var actionHtml = '<div class="btn-group">';
                    actionHtml += '<a href="#" class="btn btn-primary btn-xs edit-user" data-id="' + user.id + '">编辑</a>';
                    actionHtml += '<a href="#" class="btn btn-danger btn-xs delete-user" data-id="' + user.id + '">删除</a>';
                    actionHtml += '</div>';
                    
                    row.append($('<td></td>').html(actionHtml));
                    tbody.append(row);
                });
                
                // 绑定编辑和删除事件
                bindUserActions();
            } else {
                var emptyRow = $('<tr><td colspan="7" class="text-center">暂无数据</td></tr>');
                tbody.append(emptyRow);
            }
            
            // 更新分页信息
            updatePagination(data);
        }
        
        // 绑定用户操作事件
        function bindUserActions() {
            // 编辑用户
            $('.edit-user').click(function() {
                var userId = $(this).data('id');
                
                // 获取用户详情
                $.ajax({
                    url: '/auth/users/' + userId,
                    type: 'GET',
                    dataType: 'json',
                    success: function(user) {
                        // 填充表单
                        $('#userId').val(user.id);
                        $('#userUsername').val(user.username);
                        $('#userUserId').val(user.user_id);
                        $('#userSchool').val(user.school);
                        $('#userAgeGroup').val(user.age_group);
                        $('#userRole').val(user.role || 'USER');
                        
                        // 清空密码字段
                        $('#userPassword').val('');
                        
                        $('#userModalLabel').text('编辑用户');
                        $('#userModal').modal('show');
                    },
                    error: function(xhr, status, error) {
                        showMessage('获取用户详情失败，请稍后重试', 'danger');
                    }
                });
            });
            
            // 删除用户
            $('.delete-user').click(function() {
                var userId = $(this).data('id');
                
                if (confirm('确定要删除该用户吗？')) {
                    $.ajax({
                        url: '/auth/users/' + userId,
                        type: 'DELETE',
                        dataType: 'json',
                        success: function(response) {
                            showMessage('删除成功');
                            loadUsers();
                        },
                        error: function(xhr, status, error) {
                            var errorMessage = '删除失败，请稍后重试';
                            if (xhr.responseJSON && xhr.responseJSON.detail) {
                                errorMessage = xhr.responseJSON.detail;
                            }
                            showMessage(errorMessage, 'danger');
                        }
                    });
                }
            });
        }
        
        // 更新分页
        function updatePagination(data) {
            var totalItems = data.total;
            var pageSize = data.page_size;
            var currentPage = data.page;
            var totalPages = Math.ceil(totalItems / pageSize);
            
            // 更新分页信息
            $('#userTableInfo').text('显示 ' + ((currentPage - 1) * pageSize + 1) + ' 到 ' + Math.min(currentPage * pageSize, totalItems) + ' 条，共 ' + totalItems + ' 条记录');
            
            // 生成分页按钮
            var paginationHtml = '';
            
            // 上一页按钮
            var prevClass = currentPage === 1 ? 'disabled' : '';
            paginationHtml += '<li class="page-item ' + prevClass + '"><a class="page-link" href="#" data-page="' + (currentPage - 1) + '">上一页</a></li>';
            
            // 页码按钮
            for (var i = 1; i <= totalPages; i++) {
                var activeClass = currentPage === i ? 'active' : '';
                paginationHtml += '<li class="page-item ' + activeClass + '"><a class="page-link" href="#" data-page="' + i + '">' + i + '</a></li>';
            }
            
            // 下一页按钮
            var nextClass = currentPage === totalPages ? 'disabled' : '';
            paginationHtml += '<li class="page-item ' + nextClass + '"><a class="page-link" href="#" data-page="' + (currentPage + 1) + '">下一页</a></li>';
            
            // 更新分页容器
            $('#userTablePagination ul').html(paginationHtml);
            
            // 绑定分页点击事件
            $('#userTablePagination .page-link').click(function() {
                var page = $(this).data('page');
                if (page > 0 && page <= totalPages) {
                    loadUsers(page);
                }
            });
        }
        
        // 获取年龄段文本
        function getAgeGroupText(ageGroup) {
            var ageGroupMap = {
                'PRIMARY': '小学',
                'JUNIOR': '初中',
                'SENIOR': '高中'
            };
            return ageGroupMap[ageGroup] || ageGroup;
        }
        
        // 获取角色文本
        function getRoleText(role) {
            var roleMap = {
                'ADMIN': '管理员',
                'USER': '普通用户'
            };
            return roleMap[role] || role || '普通用户';
        }
    });
</script>
{% endblock %}
